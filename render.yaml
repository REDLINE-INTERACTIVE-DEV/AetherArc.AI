services:
  - type: web
    name: aetherarc-ai
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: POLLINATIONS_IMAGE_MODEL
        value: flux
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_USER_ID
        sync: false
      - key: AETHER_GITHUB_OWNER
        value: REDLINE-INTERACTIVE-DEV
      - key: AETHER_GITHUB_REPO
        value: AetherArc.AI
      - key: AETHER_GITHUB_BRANCH
        value: main
