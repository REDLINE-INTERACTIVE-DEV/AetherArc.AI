<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aether</title><style>:root{--bg:#0b0714;--p:#120d20;--line:#2b1d46;--text:#f7f3ff;--muted:#a89cbd;--purple:#9b6cff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}.screen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(430px,100%);padding:26px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#19102a,#0f0918)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:12px}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#b084ff,#6b35d6);font-weight:800;font-size:21px}.name{font-size:25px;font-weight:750}.sub,small,.meta{color:var(--muted)}.sub{line-height:1.45;margin-bottom:18px}.tabs{display:flex;gap:7px}.tab,.btn{border:1px solid var(--line);border-radius:13px;padding:12px;color:var(--text);background:#18112a}.tab{flex:1}.active{background:#6f42d933;border-color:#8b5cf6}.field{width:100%;margin:6px 0;padding:13px;border:1px solid var(--line);border-radius:13px;background:#0b0712;color:var(--text)}.btn{width:100%;margin-top:9px}.primary{background:linear-gradient(135deg,#9b6cff,#713fdb);border:0}.error{min-height:20px;color:#ff9baf;margin-top:8px}.chat{height:100%;display:grid;grid-template-columns:270px 1fr}.side{border-right:1px solid var(--line);background:#0d0816;padding:14px;display:flex;flex-direction:column;gap:10px}.new{padding:11px;text-align:left;border-radius:12px;border:1px solid var(--line);background:#171024;color:var(--text)}.history{overflow:auto}.item{padding:9px 10px;border-radius:10px}.item:hover{background:#1c1330}.title,.preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title{font-size:13px}.preview{font-size:11px;color:var(--muted);margin-top:2px}.bottom{margin-top:auto}.settingsBtn{background:none;border:0;color:var(--muted);padding:10px;text-align:left}.main{min-width:0;display:flex;flex-direction:column;background:radial-gradient(circle at 50% -20%,#32195b33,transparent 45%),var(--bg)}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.messages{flex:1;overflow:auto;padding:24px max(18px,calc((100% - 820px)/2))}.msg{max-width:820px;margin:0 auto 18px;white-space:pre-wrap;line-height:1.55}.user{display:flex;justify-content:flex-end}.user .body{background:linear-gradient(135deg,#7544d4,#5d35ae);border-radius:18px 18px 5px 18px;padding:11px 14px;max-width:78%}.compose{padding:10px 16px 14px}.form{max-width:820px;margin:auto;display:flex;gap:8px;border:1px solid var(--line);background:#120c1e;border-radius:17px;padding:8px}.form textarea{flex:1;border:0;outline:0;background:transparent;color:var(--text);resize:none;padding:7px;min-height:24px;max-height:150px}.send{width:42px;border:0;border-radius:13px;background:var(--purple);color:white}.overlay{position:fixed;inset:0;background:#0008;display:flex;justify-content:flex-end}.panel{height:100%;width:min(380px,92%);background:#100a1b;border-left:1px solid var(--line);padding:20px}.head{display:flex;justify-content:space-between}.close{background:none;border:0;color:var(--muted);font-size:24px}.setting{padding:15px 0;border-bottom:1px solid var(--line)}select{width:100%;margin-top:8px;padding:10px;background:#171024;color:var(--text);border:1px solid var(--line);border-radius:10px}@media(max-width:700px){.chat{grid-template-columns:1fr}.side{display:none}.messages{padding:18px 14px}}</style></head><body><script>
const $=id=>document.getElementById(id);let backendUrl="",token="",cid=null,pending={},rid=0,guest=false;
const sid=localStorage.getItem("aether_session_id")||(crypto.randomUUID?crypto.randomUUID():"aether-"+Date.now());localStorage.setItem("aether_session_id",sid);
try{backendUrl=(AndroidAether.getBackendUrl()||"").replace(/\/$/,"")}catch(e){}
function post(url,body,t=token){return new Promise((ok,no)=>{let id="r"+(++rid);pending[id]={ok,no};try{AndroidAether.postJson(id,url,t?("Bearer "+t):"",JSON.stringify(body))}catch(e){no(e)}})}
window.__aetherNativeResponse=(id,raw)=>{try{let d=JSON.parse(raw),p=pending[id];if(!p)return;delete pending[id];if(d.ok)p.ok(JSON.parse(d.body||"{}"));else{let e=new Error(d.body||"HTTP "+d.code);e.code=d.code;p.no(e)}}catch(e){}};
window.__aetherOAuthToken=t=>{token=t;guest=false;localStorage.setItem("aether_access_token",t);localStorage.removeItem("aether_guest_token");openChat("User")};
const brand='<div class="brand"><div class="mark">A</div><div class="name">Aether</div></div>';
function login(){document.body.innerHTML='<div class="screen"><div class="card">'+brand+'<div class="sub">Sign in to keep your account and saved conversations.</div><div class="tabs"><button id="i" class="tab active">Sign in</button><button id="u" class="tab">Create account</button></div><input id="e" class="field" type="email" placeholder="Email"><input id="p" class="field" type="password" placeholder="Password (8+ characters)"><button id="go" class="btn primary">Sign in</button><button id="g" class="btn">Continue with Google</button><button id="guest" class="btn">Continue as Guest · 10 messages</button><div id="err" class="error"></div></div></div>';let up=false,paint=()=>{$("i").className="tab "+(!up?"active":"");$("u").className="tab "+(up?"active":"");$("go").textContent=up?"Create account":"Sign in"};$("i").onclick=()=>{up=false;paint()};$("u").onclick=()=>{up=true;paint()};$("go").onclick=async()=>{if(!$("e").value||$("p").value.length<8){$("err").textContent="Enter a valid email and password with at least 8 characters.";return}try{let d=await post(backendUrl+"/api/auth/"+(up?"register":"login"),{email:$("e").value.trim(),password:$("p").value},"");token=d.access_token;localStorage.setItem("aether_access_token",token);localStorage.removeItem("aether_guest_token");openChat("User")}catch(e){$("err").textContent=e.message||"Authentication failed."}};$("g").onclick=async()=>{try{let d=await post(backendUrl+"/api/auth/google/login",{},"");AndroidAether.openExternal(d.login_url)}catch(e){$("err").textContent=e.message||"Google sign-in is not configured."}};$("guest").onclick=async()=>{try{let d=await post(backendUrl+"/api/auth/guest",{},"");token=d.access_token;guest=true;localStorage.setItem("aether_guest_token",token);localStorage.removeItem("aether_access_token");openChat("Guest",d.messages_remaining)}catch(e){$("err").textContent=e.message||"Guest mode unavailable."}}}
async function hist(){if(guest)return[];try{return(await post(backendUrl+"/api/history",{})).history||[]}catch(e){return[]}}
function drawHist(a){let h=$("history");if(!h)return;h.innerHTML="";a.forEach(x=>{let b=document.createElement("div");b.className="item";b.innerHTML='<div class="title"></div><div class="preview"></div>';b.querySelector(".title").textContent=x.title||"New chat";b.querySelector(".preview").textContent=x.preview||"No messages yet";b.onclick=()=>openOld(x.id);h.appendChild(b)})}
async function openOld(id){try{let d=await post(backendUrl+"/api/history/"+id,{});cid=id;$("messages").innerHTML="";d.messages.forEach(m=>add(m.content,m.role==="user"));drawHist(await hist())}catch(e){}}
function add(t,user=false){let r=document.createElement("div");r.className="msg "+(user?"user":"");let b=document.createElement("div");b.className="body";b.textContent=String(t??"");r.appendChild(b);$("messages").appendChild(r);$("messages").scrollTop=$("messages").scrollHeight;return r}
function settings(){let o=document.createElement("div");o.className="overlay";o.innerHTML='<aside class="panel"><div class="head"><b>Settings</b><button class="close">×</button></div><div class="setting"><b>General</b><br><small>Simple controls for Aether.</small></div><div class="setting"><b>Send messages</b><select><option>Enter to send</option><option>Shift + Enter to send</option></select></div><div class="setting"><b>Compact chat</b><br><small>Reduce message spacing.</small><br><input type="checkbox"></div><div class="setting"><b>Account</b><br><small>'+(guest?"Guest session":"Signed-in account")+'</small></div><button id="logout" class="btn">Log out</button></aside>';o.querySelector(".close").onclick=()=>o.remove();o.querySelector("#logout").onclick=()=>{localStorage.removeItem("aether_access_token");localStorage.removeItem("aether_guest_token");location.reload()};document.body.appendChild(o)}
async function openChat(name,remaining){document.body.innerHTML='<div class="chat"><aside class="side">'+brand+'<button id="new" class="new">＋ New chat</button><div id="history" class="history"></div><div class="bottom"><button id="settings" class="settingsBtn">⚙ Settings</button></div></aside><section class="main"><header class="top"><div><b>Aether</b><div class="meta">Native intelligence</div></div><div id="quota" class="meta">'+(guest?"Guest · "+(remaining??10)+" messages left":name+" · saved")+'</div></header><main id="messages" class="messages"></main><div class="compose"><form id="form" class="form"><textarea id="input" rows="1" placeholder="Message Aether…"></textarea><button class="send">↑</button></form></div></section></div>';$("new").onclick=()=>{cid=null;$("messages").innerHTML=""};$("settings").onclick=settings;drawHist(await hist());$("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("form").onsubmit=e=>{e.preventDefault();send()}}
async function send(){let i=$("input"),text=i.value.trim();if(!text)return;i.value="";add(text,true);let r=add("…");try{let d=await post(backendUrl+"/api/chat",{message:text,session_id:sid,conversation_id:cid||undefined,include_team_activity:false});r.remove();cid=d.conversation_id||cid;let q=d.guest_messages_remaining;if(guest&&q!==undefined)$("quota").textContent="Guest · "+q+" messages left";add(d.content||"I couldn't produce a response.");// history refresh is intentionally deferred to avoid a second network request after every reply}catch(e){r.querySelector(".body").textContent=e.code===429?"Guest limit reached. Log in to continue.":"Aether couldn't reach the backend."}}
if(!backendUrl)document.body.innerHTML='<div class="screen"><div class="card">'+brand+'<div class="error">Backend unavailable.</div></div></div>';else{let a=localStorage.getItem("aether_access_token"),g=localStorage.getItem("aether_guest_token");if(a){token=a;openChat("User")}else if(g){token=g;guest=true;openChat("Guest",10)}else login()}
</script></body></html>
