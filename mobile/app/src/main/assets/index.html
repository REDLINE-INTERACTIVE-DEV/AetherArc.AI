<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aether</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f4f7fb;font:15px system-ui;height:100vh}.screen{min-height:100vh;display:flex;flex-direction:column}.center{align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:430px;background:#101622;border:1px solid #263246;border-radius:22px;padding:24px}.logo{font-size:32px;font-weight:700;margin-bottom:6px}.sub{color:#8f9aae;margin-bottom:22px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{flex:1;padding:11px;border-radius:12px;border:1px solid #263246;background:transparent;color:#9ba7ba}.tab.active{background:#263246;color:#fff}.field{width:100%;padding:13px;margin:6px 0;background:#080c13;color:#fff;border:1px solid #263246;border-radius:12px}.btn{width:100%;padding:13px;margin-top:9px;border:0;border-radius:12px;background:#7c5cff;color:white;font-weight:600}.btn.alt{background:#18202d}.error{color:#ff8e8e;min-height:20px;margin-top:8px;font-size:13px}.chat{height:100vh;display:flex;flex-direction:column}.chat header{padding:16px 18px;border-bottom:1px solid #263246}.meta{font-size:12px;color:#8f9aae;margin-top:4px}.messages{flex:1;overflow:auto;padding:18px}.bubble{padding:12px 14px;border-radius:16px;background:#101622;border:1px solid #263246;margin:10px 0;white-space:pre-wrap;line-height:1.45}.user{text-align:right}.composer{display:flex;gap:8px;padding:10px}.composer textarea{flex:1;background:#101622;color:#fff;border:1px solid #263246;border-radius:14px;padding:12px;resize:none}.send{width:56px;background:#7c5cff;color:white;border:0;border-radius:14px}</style></head><body><div id="app"></div><script>
const $=id=>document.getElementById(id);let backendUrl="",accessToken="",conversationId=null,pending={},n=0;
let sessionId=localStorage.getItem("aether_session_id")||(crypto.randomUUID?crypto.randomUUID():"aether-"+Date.now());localStorage.setItem("aether_session_id",sessionId);
try{backendUrl=(AndroidAether.getBackendUrl()||"").replace(/\/$/,"")}catch(e){}
function post(url,body,token=""){return new Promise((resolve,reject)=>{let id="r"+(++n);pending[id]={resolve,reject};try{AndroidAether.postJson(id,url,token?("Bearer "+token):"",JSON.stringify(body))}catch(e){delete pending[id];reject(e)}})}
window.__aetherNativeResponse=(id,raw)=>{try{let d=JSON.parse(raw),p=pending[id];if(!p)return;delete pending[id];if(d.ok)p.resolve(JSON.parse(d.body||"{}"));else{let e=new Error(d.body||("HTTP "+d.code));e.code=d.code;p.reject(e)}}catch(e){let p=pending[id];if(p){delete pending[id];p.reject(e)}}};
window.__aetherOAuthToken=(token)=>{if(!token)return;accessToken=token;localStorage.setItem("aether_access_token",token);localStorage.removeItem("aether_guest_token");openChat("User",false);};
function showLogin(){document.body.innerHTML='<div class="screen center"><div class="card"><div class="logo">Aether</div><div class="sub">Your own AI. Sign in to keep your account, memory and API access.</div><div class="tabs"><button id="signInTab" class="tab active">Sign in</button><button id="signUpTab" class="tab">Create account</button></div><input id="email" class="field" type="email" autocomplete="email" placeholder="Email"><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Password (8+ characters)"><button id="submit" class="btn">Sign in</button><button id="google" class="btn alt">Continue with Google</button><button id="guest" class="btn alt">Continue as Guest · 10 messages</button><div id="error" class="error"></div></div></div>';let signup=false;$("signInTab").onclick=()=>{signup=false;update()};$("signUpTab").onclick=()=>{signup=true;update()};function update(){$("signInTab").className="tab "+(!signup?"active":"");$("signUpTab").className="tab "+(signup?"active":"");$("submit").textContent=signup?"Create account":"Sign in";$("password").autocomplete=signup?"new-password":"current-password"}$("submit").onclick=async()=>{let email=$("email").value.trim(),password=$("password").value;if(!email||password.length<8){$("error").textContent="Enter a valid email and a password with at least 8 characters.";return}try{let d=await post(backendUrl+"/api/auth/"+(signup?"register":"login"),{email,password});accessToken=d.access_token;localStorage.setItem("aether_access_token",accessToken);localStorage.removeItem("aether_guest_token");openChat(d.user?.name||d.user?.email||"User",false)}catch(e){$("error").textContent=e.message||"Authentication failed."}};$("guest").onclick=async()=>{try{let d=await post(backendUrl+"/api/auth/guest",{});accessToken=d.access_token;localStorage.setItem("aether_guest_token",accessToken);localStorage.removeItem("aether_access_token");openChat("Guest",true,d.messages_remaining)}catch(e){$("error").textContent=e.message||"Guest mode unavailable."}};$("google").onclick=()=>oauth("google")};
async function oauth(provider){$("error").textContent="Opening "+provider+"…";try{let d=await post(backendUrl+"/api/auth/"+provider+"/login",{});AndroidAether.openExternal(d.login_url)}catch(e){$("error").textContent=e.message||"OAuth login is not configured on this server."}}
function openChat(name,guest,remaining){document.body.innerHTML='<div class="chat"><header><b>Aether</b> · <span id="status">Online · native brain</span><div class="meta" id="quota">'+(guest?"Guest · "+remaining+" messages remaining":name+" · signed in")+'</div></header><main id="messages" class="messages"><div class="bubble">Hey. I\'m Aether. My native brain is online.</div></main><form id="composer" class="composer"><textarea id="input" placeholder="Message Aether…"></textarea><button class="send">➤</button></form></div>';function add(t,c){let d=document.createElement("div");d.className="bubble "+(c||"");d.textContent=String(t??"");$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight;return d}function responseText(d){return d?.content??d?.message??d?.response??d?.reply??d?.text??""}async function send(){let text=$("input").value.trim();if(!text)return;$("input").value="";add(text,"user");let t=add("Thinking…");try{let d=await post(backendUrl+"/api/chat",{message:text,session_id:sessionId,force_agent:null,include_team_activity:false,conversation_id:conversationId||undefined},accessToken);t.remove();conversationId=d.conversation_id||conversationId;let q=d.guest_messages_remaining??d.messages_remaining??d.remaining;if(guest&&q!==undefined)$("quota").textContent="Guest · "+q+" messages remaining";add(responseText(d)||"Aether received your message, but no response text was returned.")}catch(e){t.textContent=e.code===429?"Guest limit reached. Log in to continue.":"Aether could not reach the backend."}}$("composer").onsubmit=e=>{e.preventDefault();send()};$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}})}
if(!backendUrl){document.body.innerHTML='<div class="screen center"><div class="card"><div class="logo">Aether</div><div class="error">Backend unavailable. This build needs its configured Aether backend.</div></div></div>'}else{let saved=localStorage.getItem("aether_access_token"),guest=localStorage.getItem("aether_guest_token");if(saved){accessToken=saved;openChat("User",false)}else if(guest){accessToken=guest;openChat("Guest",true,"10")}else showLogin()}
</script></body></html>
