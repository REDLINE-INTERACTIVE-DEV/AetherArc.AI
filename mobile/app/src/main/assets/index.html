<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aether</title><style>
:root{--bg:#0b0814;--panel:#120d1d;--line:#302342;--text:#f7f3ff;--muted:#9d92ad;--p:#8b5cf6;--p2:#6d3fd1;--bubble:#171126;--user:#7044d9}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}button,input,textarea{font:inherit}.screen{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:430px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}.mark,.smark{display:grid;place-items:center;background:linear-gradient(145deg,#b394ff,var(--p2));font-weight:800}.mark{width:44px;height:44px;border-radius:13px;font-size:23px}.smark{width:30px;height:30px;border-radius:9px}.brand b{font-size:27px}.muted{color:var(--muted)}.tabs{display:flex;gap:7px;margin:16px 0}.tab,.ghost{flex:1;padding:11px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--muted)}.tab.active{background:#291943;color:#fff}.field{width:100%;padding:13px;margin:5px 0;background:#0b0811;color:#fff;border:1px solid var(--line);border-radius:12px}.btn{width:100%;padding:13px;margin-top:9px;border:0;border-radius:12px;background:linear-gradient(135deg,#9668ff,#6d3fd1);color:#fff;font-weight:650}.alt{background:#1a1327!important;border:1px solid var(--line)!important}.error{min-height:20px;color:#ff9eaa;font-size:13px;margin-top:8px}.app{height:100%;display:flex;overflow:hidden}.side{width:275px;background:#0d0917;border-right:1px solid var(--line);padding:13px;display:flex;flex-direction:column}.sidehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sidebrand{display:flex;gap:8px;align-items:center;font-weight:700}.icon{width:38px;height:38px;border:1px solid var(--line);background:#151021;color:#fff;border-radius:11px}.new{padding:11px;border:1px solid #50347e;background:#1a122b;color:#eee6ff;border-radius:12px;text-align:left}.label{font-size:11px;color:#756b82;text-transform:uppercase;letter-spacing:.08em;margin:18px 7px 7px}.hist{border:0;background:transparent;color:#ddd5e8;text-align:left;padding:10px 8px;border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sidebottom{margin-top:auto}.settingsbtn{width:100%;border:0;background:transparent;color:#ddd5e8;text-align:left;padding:11px}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:#0d0917}.menu{display:none}.account{margin-left:auto;color:var(--muted);font-size:12px}.msgs{flex:1;overflow:auto;padding:22px max(16px,calc((100% - 760px)/2))}.msgs.empty{display:flex;align-items:center;justify-content:center}.row{display:flex;margin:13px 0}.row.user{justify-content:flex-end}.bubble{max-width:min(760px,90%);padding:12px 15px;border:1px solid var(--line);border-radius:18px;background:var(--bubble);white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}.user .bubble{background:var(--user)}.typing{display:flex;gap:5px}.dot{width:6px;height:6px;border-radius:50%;background:#b394ff;animation:p 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes p{0%,70%,100%{opacity:.25}35%{opacity:1}}.wrap{padding:10px max(14px,calc((100% - 790px)/2)) 14px}.composer{display:flex;gap:8px;background:#130e20;border:1px solid #382755;border-radius:18px;padding:8px}.composer textarea{flex:1;min-height:42px;max-height:160px;background:transparent;color:#fff;border:0;outline:0;resize:none;padding:10px}.send{width:43px;height:43px;border:0;border-radius:13px;background:var(--p);color:#fff}.send:disabled{opacity:.45}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.panel{width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px}.setting{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-bottom:1px solid #211a31}.setting small{display:block;color:var(--muted);margin-top:3px}.switch{appearance:none;width:42px;height:24px;border-radius:20px;background:#392f48;position:relative}.switch:checked{background:var(--p)}.switch:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff}.switch:checked:after{left:21px}@media(max-width:760px){.side{position:fixed;z-index:5;inset:0 auto 0 0;transform:translateX(-105%);transition:.2s;width:285px}.side.open{transform:none}.menu{display:block}.account{display:none}.msgs{padding:18px 12px}.bubble{max-width:94%}}
</style></head><body><div id="root"></div><script>
const $=id=>document.getElementById(id);let backendUrl="",accessToken="",conversationId=null,pending={},seq=0,busy=false,guest=false;
let sessionId=localStorage.getItem("aether_session_id")||(crypto.randomUUID?crypto.randomUUID():"aether-"+Date.now());localStorage.setItem("aether_session_id",sessionId);
try{backendUrl=(AndroidAether.getBackendUrl()||"").replace(/\/$/,"")}catch(e){}
function post(url,body,token=""){return new Promise((ok,no)=>{let id="r"+(++seq);pending[id]={ok,no};try{AndroidAether.postJson(id,url,token?"Bearer "+token:"",JSON.stringify(body))}catch(e){delete pending[id];no(e)}})}
window.__aetherNativeResponse=(id,raw)=>{try{let d=JSON.parse(raw),p=pending[id];if(!p)return;delete pending[id];if(d.ok)p.ok(JSON.parse(d.body||"{}"));else{let e=new Error(d.body||("HTTP "+d.code));e.code=d.code;p.no(e)}}catch(e){let p=pending[id];if(p){delete pending[id];p.no(e)}}};
window.__aetherOAuthToken=t=>{if(!t)return;accessToken=t;guest=false;localStorage.setItem("aether_access_token",t);localStorage.removeItem("aether_guest_token");openChat("User",false)};
function logo(s){return '<div class="'+(s?"smark":"mark")+'">A</div>'}
function showLogin(){document.body.innerHTML='<div class="screen"><div class="card"><div class="brand">'+logo()+'<b>Aether</b></div><div class="muted">Sign in to keep your account, conversations and memory.</div><div class="tabs"><button id="si" class="tab active">Sign in</button><button id="su" class="tab">Create account</button></div><input id="em" class="field" type="email" placeholder="Email"><input id="pw" class="field" type="password" placeholder="Password (8+ characters)"><button id="go" class="btn">Sign in</button><button id="gg" class="btn alt">Continue with Google</button><button id="gu" class="btn alt">Continue as Guest · 10 messages</button><div id="err" class="error"></div></div></div>';let up=false;function refresh(){$("si").className="tab "+(!up?"active":"");$("su").className="tab "+(up?"active":"");$("go").textContent=up?"Create account":"Sign in"}$("si").onclick=()=>{up=false;refresh()};$("su").onclick=()=>{up=true;refresh()};$("go").onclick=async()=>{let email=$("em").value.trim(),password=$("pw").value;if(!email||password.length<8){$("err").textContent="Enter a valid email and a password with at least 8 characters.";return}try{let d=await post(backendUrl+"/api/auth/"+(up?"register":"login"),{email,password});accessToken=d.access_token;localStorage.setItem("aether_access_token",accessToken);localStorage.removeItem("aether_guest_token");openChat(d.user?.name||"User",false)}catch(e){$("err").textContent=e.message||"Authentication failed."}};$("gg").onclick=()=>oauth("google");$("gu").onclick=async()=>{try{let d=await post(backendUrl+"/api/auth/guest",{});accessToken=d.access_token;guest=true;localStorage.setItem("aether_guest_token",accessToken);localStorage.removeItem("aether_access_token");openChat("Guest",true,d.messages_remaining)}catch(e){$("err").textContent=e.message||"Guest mode unavailable."}}}
async function oauth(p){try{let d=await post(backendUrl+"/api/auth/"+p+"/login",{});AndroidAether.openExternal(d.login_url)}catch(e){document.getElementById("err").textContent=e.message||"OAuth login is not configured."}}
function recent(){try{return JSON.parse(localStorage.getItem("aether_recent_chats")||"[]")}catch(e){return[]}}function saveRecent(t){let h=recent().filter(x=>x!==t);h.unshift(t);localStorage.setItem("aether_recent_chats",JSON.stringify(h.slice(0,2)))}function renderRecent(){$("history").innerHTML=recent().map(x=>'<button class="hist">'+x.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))+"</button>").join("")}
function openChat(name,isGuest,remaining){guest=isGuest;document.body.innerHTML='<div class="app"><aside id="side" class="side"><div class="sidehead"><div class="sidebrand">'+logo(true)+'<span>Aether</span></div><button id="x" class="icon">×</button></div><button id="new" class="new">＋ New chat</button><div class="label">Recent</div><div id="history"></div><div class="sidebottom"><button id="settings" class="settingsbtn">⚙ Settings</button></div></aside><section class="main"><header class="top"><button id="menu" class="icon menu">☰</button><b>Aether</b><span id="account" class="account"></span></header><main id="msgs" class="msgs empty"></main><div class="wrap"><form id="composer" class="composer"><textarea id="input" rows="1" placeholder="Message Aether…"></textarea><button id="send" class="send">↑</button></form></div></section></div><div id="modal" class="modal"><div class="panel"><div class="sidehead"><b>Settings</b><button id="close" class="icon">×</button></div><div class="setting"><div><b>General</b><small>Simple, responsive Aether chat.</small></div><span>✓</span></div><div class="setting"><div><b>Enter to send</b><small>Shift + Enter makes a new line.</small></div><input id="enter" class="switch" type="checkbox" checked></div><div class="setting"><div><b>Compact chat</b><small>Tighter spacing for long chats.</small></div><input id="compact" class="switch" type="checkbox"></div><div class="setting"><div><b>Save recent chats</b><small>Keep two recent chat titles on this device.</small></div><input id="save" class="switch" type="checkbox" checked></div><div class="setting"><div><b>Memory</b><small>Signed-in conversations can be stored with your account.</small></div><span>On</span></div><div class="setting"><div><b>Theme</b><small>Purple Aether theme.</small></div><span>Purple</span></div><div class="setting"><div><b>Account</b><small>Current session</small></div><button id="logout" class="ghost">Log out</button></div></div></div>';$("account").textContent=isGuest?"Guest · "+(remaining??10)+" remaining":name+" · signed in";renderRecent();
$("menu").onclick=()=>$("side").classList.add("open");$("x").onclick=()=>$("side").classList.remove("open");$("new").onclick=()=>{conversationId=null;$("msgs").innerHTML="";$("msgs").classList.add("empty");$("input").focus();$("side").classList.remove("open")};$("settings").onclick=()=>$("modal").classList.add("open");$("close").onclick=()=>$("modal").classList.remove("open");$("logout").onclick=()=>{localStorage.removeItem("aether_access_token");localStorage.removeItem("aether_guest_token");accessToken="";showLogin()};$("compact").onchange=e=>document.body.classList.toggle("compact",e.target.checked);$("save").onchange=e=>{if(!e.target.checked)localStorage.removeItem("aether_recent_chats");renderRecent()};$("input").addEventListener("input",()=>{$("input").style.height="auto";$("input").style.height=Math.min($("input").scrollHeight,160)+"px"});$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&$("enter").checked){e.preventDefault();$("composer").requestSubmit()}});$("composer").onsubmit=e=>{e.preventDefault();send()}}
function add(t,user){let box=$("msgs");box.classList.remove("empty");let r=document.createElement("div");r.className="row"+(user?" user":"");let b=document.createElement("div");b.className="bubble";b.textContent=String(t??"");r.appendChild(b);box.appendChild(r);box.scrollTop=box.scrollHeight;return r}function typing(){let box=$("msgs");box.classList.remove("empty");let r=document.createElement("div");r.className="row";r.innerHTML='<div class="bubble typing"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>';box.appendChild(r);box.scrollTop=box.scrollHeight;return r}
async function send(){if(busy)return;let text=$("input").value.trim();if(!text)return;busy=true;$("send").disabled=true;$("input").value="";$("input").style.height="auto";add(text,true);if($("save").checked){saveRecent(text.slice(0,48));renderRecent()}let t=typing();try{let d=await post(backendUrl+"/api/chat",{message:text,session_id:sessionId,force_agent:null,include_team_activity:false,conversation_id:conversationId||undefined},accessToken);t.remove();conversationId=d.conversation_id||conversationId;let q=d.guest_messages_remaining??d.messages_remaining??d.remaining;if(guest&&q!==undefined)$("account").textContent="Guest · "+q+" remaining";add(d?.content??d?.message??d?.response??d?.reply??d?.text??"I didn't receive a response from the Aether service.",false)}catch(e){t.remove();add(e.code===429?"Guest limit reached. Log in to continue.":"Aether couldn't reach the service. Please try again.",false)}finally{busy=false;$("send").disabled=false;$("input").focus()}}
if(!backendUrl){document.body.innerHTML='<div class="screen"><div class="card"><div class="brand">'+logo()+'<b>Aether</b></div><div class="error">Backend unavailable. This build needs its configured Aether backend.</div></div></div>'}else{let a=localStorage.getItem("aether_access_token"),g=localStorage.getItem("aether_guest_token");if(a){accessToken=a;openChat("User",false)}else if(g){accessToken=g;guest=true;openChat("Guest",true,10)}else showLogin()}
</script></body></html>
