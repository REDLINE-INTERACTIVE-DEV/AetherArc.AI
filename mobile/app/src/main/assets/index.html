<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aether</title><style>body{margin:0;background:#070a10;color:#f4f7fb;font:15px system-ui;height:100vh;display:flex;flex-direction:column}header{padding:18px;border-bottom:1px solid #263246}main{flex:1;overflow:auto;padding:18px}.bubble{padding:12px 14px;border-radius:16px;background:#101622;border:1px solid #263246;margin:10px 0;white-space:pre-wrap;line-height:1.45}.user{text-align:right}.composer{display:flex;gap:8px;padding:10px}textarea{flex:1;background:#101622;color:#fff;border:1px solid #263246;border-radius:14px;padding:12px;resize:none}.send{width:56px;background:#7c5cff;color:white;border:0;border-radius:14px}</style></head><body><header><b>Aether</b> · <span id="status">Starting…</span></header><main id="messages"><div class="bubble">Hey. I'm Aether. My native brain is starting up.</div></main><form id="composer" class="composer"><textarea id="input" placeholder="Message Aether…"></textarea><button class="send">➤</button></form><script>const $=id=>document.getElementById(id);let backendUrl="",jwt="",conversationId=null,pending={},n=0;let sessionId=localStorage.getItem("aether_session_id");if(!sessionId){sessionId=(crypto.randomUUID?crypto.randomUUID():("aether-"+Date.now()+"-"+Math.random().toString(36).slice(2)));localStorage.setItem("aether_session_id",sessionId)}try{backendUrl=(AndroidAether.getBackendUrl()||"").replace(/\/$/,"")}catch(e){}function add(t,c){let d=document.createElement("div");d.className="bubble "+(c||"");d.textContent=t;$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight;return d}function post(url,body){return new Promise((resolve,reject)=>{let id="r"+(++n);pending[id]={resolve,reject};try{AndroidAether.postJson(id,url,jwt?("Bearer "+jwt):"",JSON.stringify(body))}catch(e){delete pending[id];reject(e)}})}window.__aetherNativeResponse=(id,raw)=>{try{let d=JSON.parse(raw),p=pending[id];if(!p)return;delete pending[id];if(d.ok)p.resolve(JSON.parse(d.body||"{}"));else p.reject(new Error(d.body||("HTTP "+d.code)))}catch(e){let p=pending[id];if(p){delete pending[id];p.reject(e)}}};async function send(){let text=$("input").value.trim();if(!text)return;$("input").value="";add(text,"user");let t=add("Thinking…");try{if(!backendUrl)throw Error("backend unavailable");let d=await post(backendUrl+"/api/chat",{message:text,session_id:sessionId,force_agent:null,include_team_activity:false,conversation_id:conversationId||undefined});t.remove();conversationId=d.conversation_id||conversationId;add(d.content||"(empty response)");$("status").textContent="Online · native brain"}catch(e){t.textContent="I can't reach Aether's backend right now. The app's backend endpoint needs to be configured in the build.";$("status").textContent="Backend unavailable"}}$("composer").onsubmit=e=>{e.preventDefault();send()};$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});if(!backendUrl)$("status").textContent="Backend unavailable";else fetch(backendUrl+"/health").then(r=>{if(!r.ok)throw 0;$("status").textContent="Online · native brain"}).catch(()=>$("status").textContent="Backend unavailable");</script></body></html>
