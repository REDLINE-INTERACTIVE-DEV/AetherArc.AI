<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aether</title>
<style>
:root{--bg:#070a10;--p:#101622;--line:#27344a;--text:#f5f7fb;--muted:#8995aa;--purple:#7c5cff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}
.screen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(430px,100%);padding:26px;border:1px solid var(--line);border-radius:24px;background:var(--p)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:12px}.mark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#7658ff,#3cb9f4);font-weight:800;font-size:29px;box-shadow:0 8px 22px #7c5cff45}.name{font-size:26px;font-weight:750}.sub,small,.meta{color:var(--muted)}.sub{line-height:1.45;margin-bottom:18px}.tabs{display:flex;gap:7px}.tab,.btn{border:1px solid var(--line);border-radius:13px;padding:12px;color:var(--text);background:#181f2d}.tab{flex:1}.active{background:#7c5cff22;border-color:#7c5cff}.field{width:100%;margin:6px 0;padding:13px;border:1px solid var(--line);border-radius:13px;background:#0b0f17;color:var(--text)}.btn{width:100%;margin-top:9px}.primary{background:var(--purple);border:0}.error{min-height:20px;color:#ff9baf;margin-top:8px}
.chat{height:100%;display:grid;grid-template-columns:270px 1fr}.side{border-right:1px solid var(--line);background:#0b0f17;padding:14px;display:flex;flex-direction:column;gap:10px}.new{padding:11px;text-align:left;border-radius:12px;border:1px solid var(--line);background:#151d2b;color:var(--text)}.historyLabel{font-size:12px;color:var(--muted);padding:6px 10px 0}.history{overflow:auto}.item{padding:9px 10px;border-radius:10px}.item:hover{background:#151d2b}.title,.preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title{font-size:13px}.preview{font-size:11px;color:var(--muted);margin-top:2px}.bottom{margin-top:auto}.settingsBtn{background:none;border:0;color:var(--muted);padding:10px;text-align:left}.main{min-width:0;display:flex;flex-direction:column;background:radial-gradient(circle at 50% -20%,#32195b33,transparent 45%),var(--bg)}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px}.topLogo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#7658ff,#3cb9f4);font-weight:800;font-size:22px}.topTitle{font-size:17px;font-weight:700}.status{font-size:12px;color:var(--muted);margin-top:3px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#36d980;margin-right:5px}.gear{margin-left:auto;width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:#111925;color:#fff}.messages{flex:1;overflow:auto;padding:24px max(18px,calc((100% - 820px)/2))}.msg{max-width:820px;margin:0 auto 18px;white-space:pre-wrap;line-height:1.55}.user{display:flex;justify-content:flex-end}.user .body{background:var(--purple);border-radius:18px 18px 5px 18px;padding:11px 14px;max-width:78%}.body{overflow-wrap:anywhere}.thinking{opacity:.7}.compose{padding:10px 16px 14px}.form{max-width:820px;margin:auto;display:flex;gap:8px;border:1px solid var(--line);background:var(--p);border-radius:17px;padding:8px}.form textarea{flex:1;border:0;outline:0;background:transparent;color:var(--text);resize:none;padding:7px;min-height:24px;max-height:150px}.send{width:48px;border:0;border-radius:13px;background:var(--purple);color:white;font-size:22px}.overlay{position:fixed;inset:0;background:#0008;display:flex;justify-content:flex-end}.panel{height:100%;width:min(380px,92%);background:#101622;border-left:1px solid var(--line);padding:20px}.head{display:flex;justify-content:space-between}.close{background:none;border:0;color:var(--muted);font-size:24px}.setting{padding:15px 0;border-bottom:1px solid var(--line)}select{width:100%;margin-top:8px;padding:10px;background:#151d2b;color:var(--text);border:1px solid var(--line);border-radius:10px}.toggle{float:right;width:44px;height:25px;accent-color:var(--purple)}@media(max-width:700px){.chat{grid-template-columns:1fr}.side{display:none}.messages{padding:18px 14px}}
</style></head><body><script>
const $=id=>document.getElementById(id);let backendUrl="",token="",cid=null,pending={},rid=0,guest=false,busy=false;
const sid=localStorage.getItem("aether_session_id")||(crypto.randomUUID?crypto.randomUUID():"aether-"+Date.now());localStorage.setItem("aether_session_id",sid);
try{backendUrl=(AndroidAether.getBackendUrl()||"").replace(/\/$/,"")}catch(e){}
function request(method,url,body,t=token,timeout=22000){return new Promise((ok,no)=>{let id="r"+(++rid),timer=setTimeout(()=>{delete pending[id];let e=new Error("Request timed out");e.code=408;no(e)},timeout);pending[id]={ok:d=>{clearTimeout(timer);ok(d)},no:e=>{clearTimeout(timer);no(e)}};try{if(method==="GET")AndroidAether.getJson(id,url,t?("Bearer "+t):"");else AndroidAether.postJson(id,url,t?("Bearer "+t):"",JSON.stringify(body||{}))}catch(e){clearTimeout(timer);delete pending[id];no(e)}})}
const get=(url,t=token)=>request("GET",url,null,t),post=(url,body,t=token)=>request("POST",url,body,t);
window.__aetherNativeResponse=(id,raw)=>{try{let d=JSON.parse(raw),p=pending[id];if(!p)return;delete pending[id];if(d.ok)p.ok(JSON.parse(d.body||"{}"));else{let e=new Error(d.body||"HTTP "+d.code);e.code=d.code;p.no(e)}}catch(e){let p=pending[id];if(p){delete pending[id];p.no(e)}}};
window.__aetherOAuthToken=t=>{token=t;guest=false;localStorage.setItem("aether_access_token",t);localStorage.removeItem("aether_guest_token");openChat("User")};
const brand='<div class="brand"><div class="mark">A</div><div class="name">Aether</div></div>';
function login(){document.body.innerHTML='<div class="screen"><div class="card">'+brand+'<div class="sub">Sign in to keep your account, native memory and saved conversations.</div><div class="tabs"><button id="i" class="tab active">Sign in</button><button id="u" class="tab">Create account</button></div><input id="e" class="field" type="email" autocomplete="email" placeholder="Email"><input id="p" class="field" type="password" autocomplete="current-password" placeholder="Password (8+ characters)"><button id="go" class="btn primary">Sign in</button><button id="g" class="btn">Continue with Google</button><button id="guest" class="btn">Continue as Guest · 10 messages</button><div id="err" class="error"></div></div></div>';let up=false,paint=()=>{$("i").className="tab "+(!up?"active":"");$("u").className="tab "+(up?"active":"");$("go").textContent=up?"Create account":"Sign in"};$("i").onclick=()=>{up=false;paint()};$("u").onclick=()=>{up=true;paint()};$("go").onclick=async()=>{if(!$("e").value||$("p").value.length<8){$("err").textContent="Enter a valid email and password with at least 8 characters.";return}try{let d=await post(backendUrl+"/api/auth/"+(up?"register":"login"),{email:$("e").value.trim(),password:$("p").value},"");token=d.access_token;localStorage.setItem("aether_access_token",token);localStorage.removeItem("aether_guest_token");openChat("User")}catch(e){$("err").textContent=e.message||"Authentication failed."}};$("g").onclick=async()=>{try{let d=await post(backendUrl+"/api/auth/google/login",{},"");AndroidAether.openExternal(d.login_url)}catch(e){$("err").textContent=e.message||"Google sign-in is not configured."}};$("guest").onclick=async()=>{try{let d=await post(backendUrl+"/api/auth/guest",{},"");token=d.access_token;guest=true;localStorage.setItem("aether_guest_token",token);localStorage.removeItem("aether_access_token");openChat("Guest",d.messages_remaining)}catch(e){$("err").textContent=e.message||"Guest mode unavailable."}}}
async function hist(){if(guest)return[];try{return(await get(backendUrl+"/api/chat/conversations?limit=2")).conversations||[]}catch(e){return[]}}
function drawHist(a){let h=$("history");if(!h)return;h.innerHTML="";a.slice(0,2).forEach(x=>{let b=document.createElement("div");b.className="item";b.innerHTML='<div class="title"></div><div class="preview"></div>';b.querySelector(".title").textContent=x.title||"New chat";b.querySelector(".preview").textContent=x.preview||"Saved conversation";b.onclick=()=>openOld(x.id);h.appendChild(b)})}
async function openOld(id){try{let d=await get(backendUrl+"/api/chat/conversations/"+id);cid=id;$("messages").innerHTML="";d.messages.forEach(m=>add(m.content,m.role==="user"));drawHist(await hist())}catch(e){}}
function add(t,user=false){let r=document.createElement("div");r.className="msg "+(user?"user":"");let b=document.createElement("div");b.className="body";b.textContent=String(t??"");r.appendChild(b);$("messages").appendChild(r);$("messages").scrollTop=$("messages").scrollHeight;return r}
function settings(){let o=document.createElement("div");o.className="overlay";o.innerHTML='<aside class="panel"><div class="head"><b>Settings</b><button class="close">×</button></div><div class="setting"><b>General</b><br><small>Aether interface and chat behavior.</small></div><div class="setting"><b>Purple theme</b><br><small>Aether’s default theme.</small></div><div class="setting"><b>Enter to send</b><input id="enter" class="toggle" type="checkbox" '+(localStorage.getItem("aether_enter_send")!=="0"?"checked":"")+'><br><small>Enter sends; Shift + Enter makes a new line.</small></div><div class="setting"><b>Compact chat</b><input id="compact" class="toggle" type="checkbox" '+(localStorage.getItem("aether_compact")==="1"?"checked":"")+'><br><small>Reduce message spacing.</small></div><div class="setting"><b>Account</b><br><small>'+(guest?"Guest session · 10-message limit":"Signed in · saved conversations")+'</small></div><button id="logout" class="btn">Log out</button></aside>';o.querySelector(".close").onclick=()=>o.remove();o.querySelector("#enter").onchange=e=>localStorage.setItem("aether_enter_send",e.target.checked?"1":"0");o.querySelector("#compact").onchange=e=>localStorage.setItem("aether_compact",e.target.checked?"1":"0");o.querySelector("#logout").onclick=()=>{localStorage.removeItem("aether_access_token");localStorage.removeItem("aether_guest_token");location.reload()};document.body.appendChild(o)}
async function openChat(name,remaining){document.body.innerHTML='<div class="chat"><aside class="side">'+brand+'<button id="new" class="new">＋ New chat</button><div class="historyLabel">Recent chats</div><div id="history" class="history"></div><div class="bottom"><button id="settings" class="settingsBtn">⚙ Settings</button></div></aside><section class="main"><header class="top"><div class="topLogo">A</div><div><div class="topTitle">Aether · Online</div><div class="status"><span class="dot"></span><span id="quota">'+(guest?"Guest · "+(remaining??10)+" messages remaining":name+" · signed in")+'</span></div></div><button id="gear" class="gear">⚙</button></header><main id="messages" class="messages"></main><div class="compose"><form id="form" class="form"><textarea id="input" rows="1" placeholder="Message Aether…"></textarea><button id="send" class="send">➤</button></form></div></section></div>';
$("new").onclick=()=>{cid=null;$("messages").innerHTML=""};$("settings").onclick=settings;$("gear").onclick=settings;drawHist(await hist());try{AndroidAether.getJson("warm",backendUrl+"/health","")}catch(e){}
$("input").onkeydown=e=>{let enter=localStorage.getItem("aether_enter_send")!=="0";if(e.key==="Enter"&&!e.shiftKey&&enter){e.preventDefault();send()}};$("form").onsubmit=e=>{e.preventDefault();send()}}
async function send(){if(busy)return;let i=$("input"),text=i.value.trim();if(!text)return;i.value="";add(text,true);let r=add("Thinking…");r.classList.add("thinking");busy=true;$("send").disabled=true;try{let d=await post(backendUrl+"/api/chat",{message:text,session_id:sid,conversation_id:cid||undefined,include_team_activity:false});r.remove();cid=d.conversation_id||cid;let q=d.guest_messages_remaining;if(guest&&q!==undefined)$("quota").textContent="Guest · "+q+" messages remaining";add(d?.content??d?.message??d?.response??d?.reply??d?.text??"Aether did not return a response.");drawHist(await hist())}catch(e){r.querySelector(".body").textContent=e.code===429?"Guest limit reached. Log in to continue.":e.code===408?"Aether is taking too long to respond. Please try again.":"Aether couldn't reach the backend."}finally{busy=false;$("send").disabled=false}}
if(!backendUrl)document.body.innerHTML='<div class="screen"><div class="card">'+brand+'<div class="error">Backend unavailable.</div></div></div>';else{let a=localStorage.getItem("aether_access_token"),g=localStorage.getItem("aether_guest_token");if(a){token=a;openChat("User")}else if(g){token=g;guest=true;openChat("Guest",10)}else login()}
</script></body></html>
