<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aether</title>
<style>
*{box-sizing:border-box}:root{--bg:#070a10;--p:#101622;--p2:#151d2b;--line:#27344a;--text:#f5f7fb;--muted:#8995aa;--purple:#7c5cff;--danger:#ff8f9a}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}
.screen{min-height:100vh;display:flex;flex-direction:column}.center{align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:430px;background:var(--p);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 18px 60px #0007}
.logoRow{display:flex;align-items:center;gap:14px;margin-bottom:8px}.logo,.sideLogo{display:grid;place-items:center;background:linear-gradient(145deg,#7658ff,#3cb9f4);color:#fff;font-weight:800}.logo{width:56px;height:56px;border-radius:17px;font-size:34px;box-shadow:0 8px 22px #7c5cff47}.sideLogo{width:38px;height:38px;border-radius:12px;font-size:23px}.brand{font-size:28px;font-weight:750}.sub{color:var(--muted);line-height:1.45;margin:0 0 22px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;padding:11px;border-radius:13px;border:1px solid var(--line);background:transparent;color:#9ba7ba}.tab.active{background:#26304a;color:#fff}.field{width:100%;padding:14px;margin:6px 0;background:#090d15;color:#fff;border:1px solid var(--line);border-radius:13px;outline:none}.field:focus{border-color:var(--purple)}
.btn{width:100%;padding:14px;margin-top:9px;border:0;border-radius:13px;background:var(--purple);color:#fff;font-weight:650}.btn.alt{background:#18202d;border:1px solid var(--line)}.error{color:var(--danger);min-height:20px;margin-top:9px;font-size:13px}
.app{height:100vh;display:flex;position:relative}.sidebar{position:absolute;z-index:20;left:0;top:0;bottom:0;width:292px;background:#0b0f17;border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .2s ease;padding:16px;display:flex;flex-direction:column}.sidebar.open{transform:translateX(0)}
.sideTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.sideBrand{display:flex;align-items:center;gap:10px;font-weight:700}.iconBtn{width:42px;height:42px;border-radius:13px;background:#111925;color:#e8edf7;border:1px solid var(--line);display:grid;place-items:center;font-size:21px}.newChat{width:100%;padding:12px;border:1px solid #3c4b68;border-radius:13px;background:#141d2c;color:#fff;margin-bottom:18px}.sideTitle{font-size:12px;color:var(--muted);margin:0 4px 8px}.history{display:flex;flex-direction:column;gap:5px}.historyRow{border:0;background:transparent;color:#dfe5ef;text-align:left;border-radius:11px;padding:10px 11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.historyRow:hover{background:#151e2c}.sideBottom{margin-top:auto}.settingsRow{display:flex;align-items:center;gap:10px;padding:11px;color:#dfe5ef;border-radius:11px}.settingsRow:hover{background:#151e2c}.scrim{position:absolute;z-index:15;inset:0;background:#0008;display:none}.scrim.show{display:block}
.chat{height:100vh;width:100%;display:flex;flex-direction:column}.chatHeader{height:76px;display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:#090d14}.headerText{min-width:0;flex:1}.headerTitle{font-size:17px;font-weight:700}.headerMeta{font-size:12px;color:var(--muted);margin-top:3px}.onlineDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#36d980;margin-right:5px}
.messages{flex:1;overflow:auto;padding:18px}.empty{height:100%;user-select:none}.bubble{max-width:88%;padding:13px 15px;border-radius:17px;background:var(--p);border:1px solid var(--line);margin:9px 0;white-space:pre-wrap;line-height:1.48;overflow-wrap:anywhere}.user{margin-left:auto;background:var(--purple);border-color:var(--purple);color:#fff}.thinking{opacity:.78}
.composer{display:flex;gap:9px;padding:10px 14px 14px;background:#090d14;border-top:1px solid #27344a73}.composer textarea{flex:1;min-height:52px;max-height:140px;background:var(--p);color:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;resize:none;outline:none}.composer textarea:focus{border-color:var(--purple)}.send{width:58px;height:58px;background:var(--purple);color:#fff;border:0;border-radius:16px;font-size:25px}.send:disabled{opacity:.55}
.modal{position:absolute;z-index:30;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:520px;background:#0f1622;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px;max-height:82vh;overflow:auto}.sheetTitle{font-size:20px;font-weight:700;margin-bottom:14px}.setting{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid #27344aa6}.settingName{font-weight:600}.settingDesc{font-size:12px;color:var(--muted);margin-top:3px}.toggle{width:48px;height:28px;border-radius:20px;border:1px solid var(--line);background:#202a3b;padding:3px}.toggle i{display:block;width:20px;height:20px;border-radius:50%;background:#9aa6b9;transition:transform .15s}.toggle.on{background:var(--purple);border-color:var(--purple)}.toggle.on i{background:#fff;transform:translateX(20px)}.closeSheet{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#172131;color:#fff;margin-top:14px}
.compact .bubble{margin:5px 0;padding:10px 13px}.compact .messages{padding-top:10px}
@media(min-width:800px){.sidebar{position:relative;transform:none}.scrim{display:none!important}.iconBtn.menu{display:none}.modal{align-items:center}.sheet{border-radius:22px;max-width:430px}}
</style></head><body><div id="app"></div><script>
const $=id=>document.getElementById(id);let backendUrl="",accessToken="",conversationId=null,pending={},n=0,guestMode=false,busy=false;
let sessionId=localStorage.getItem("aether_session_id")||(crypto.randomUUID?crypto.randomUUID():"aether-"+Date.now());localStorage.setItem("aether_session_id",sessionId);
try{backendUrl=(AndroidAether.getBackendUrl()||"").replace(/\/$/,"")}catch(e){}
function post(url,body,token=""){return new Promise((resolve,reject)=>{let id="r"+(++n);pending[id]={resolve,reject};try{AndroidAether.postJson(id,url,token?("Bearer "+token):"",JSON.stringify(body))}catch(e){delete pending[id];reject(e)}})}
function get(url,token=""){return new Promise((resolve,reject)=>{let id="r"+(++n);pending[id]={resolve,reject};try{AndroidAether.getJson(id,url,token?("Bearer "+token):"")}catch(e){delete pending[id];reject(e)}})}
window.__aetherNativeResponse=(id,raw)=>{try{let d=JSON.parse(raw),p=pending[id];if(!p)return;delete pending[id];if(d.ok)p.resolve(JSON.parse(d.body||"{}"));else{let e=new Error(d.body||("HTTP "+d.code));e.code=d.code;p.reject(e)}}catch(e){let p=pending[id];if(p){delete pending[id];p.reject(e)}}};
window.__aetherOAuthToken=token=>{if(!token)return;accessToken=token;guestMode=false;localStorage.setItem("aether_access_token",token);localStorage.removeItem("aether_guest_token");openChat("User",false)};
function logoMarkup(c="logo"){return '<div class="'+c+'">A</div>'}
function showLogin(){document.body.innerHTML='<div class="screen center"><div class="card"><div class="logoRow">'+logoMarkup()+'<div><div class="brand">Aether</div><div class="sub" style="margin:0">AetherArc · standalone AI</div></div></div><div class="sub">Sign in to keep your conversations and native memory, or continue as a guest.</div><div class="tabs"><button id="signInTab" class="tab active">Sign in</button><button id="signUpTab" class="tab">Create account</button></div><input id="email" class="field" type="email" autocomplete="email" placeholder="Email"><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Password (8+ characters)"><button id="submit" class="btn">Sign in</button><button id="google" class="btn alt">Continue with Google</button><button id="guest" class="btn alt">Continue as Guest · 10 messages</button><div id="error" class="error"></div></div></div>';let signup=false;
$("signInTab").onclick=()=>{signup=false;update()};$("signUpTab").onclick=()=>{signup=true;update()};function update(){$("signInTab").className="tab "+(!signup?"active":"");$("signUpTab").className="tab "+(signup?"active":"");$("submit").textContent=signup?"Create account":"Sign in";$("password").autocomplete=signup?"new-password":"current-password"}
$("submit").onclick=async()=>{let email=$("email").value.trim(),password=$("password").value;if(!email||password.length<8){$("error").textContent="Enter a valid email and a password with at least 8 characters.";return}try{let d=await post(backendUrl+"/api/auth/"+(signup?"register":"login"),{email,password});accessToken=d.access_token;guestMode=false;localStorage.setItem("aether_access_token",accessToken);localStorage.removeItem("aether_guest_token");openChat(d.user?.name||d.user?.email||"User",false)}catch(e){$("error").textContent=e.message||"Authentication failed."}};
$("guest").onclick=async()=>{try{let d=await post(backendUrl+"/api/auth/guest",{});accessToken=d.access_token;guestMode=true;localStorage.setItem("aether_guest_token",accessToken);localStorage.removeItem("aether_access_token");openChat("Guest",true,d.messages_remaining)}catch(e){$("error").textContent=e.message||"Guest mode unavailable."}};$("google").onclick=()=>oauth("google")}
async function oauth(provider){$("error").textContent="Opening "+provider+"…";try{let d=await post(backendUrl+"/api/auth/"+provider+"/login",{});AndroidAether.openExternal(d.login_url)}catch(e){$("error").textContent=e.message||"OAuth login is not configured on this server."}}
function closeMenus(){document.querySelector(".sidebar")?.classList.remove("open");document.querySelector(".scrim")?.classList.remove("show")}
async function loadHistory(){if(guestMode)return;try{let d=await get(backendUrl+"/api/chat/conversations?limit=2",accessToken),box=$("history");if(!box)return;box.innerHTML="";(d.conversations||[]).slice(0,2).forEach(c=>{let b=document.createElement("button");b.className="historyRow";b.textContent=c.title||"New chat";b.onclick=()=>loadConversation(c.id);box.appendChild(b)})}catch(e){}}
async function loadConversation(id){try{let d=await get(backendUrl+"/api/chat/conversations/"+id,accessToken);conversationId=id;closeMenus();$("messages").innerHTML="";(d.messages||[]).forEach(m=>addBubble(m.content,m.role==="user"?"user":"assistant"));$("messages").scrollTop=$("messages").scrollHeight}catch(e){}}
function addBubble(t,c){let d=document.createElement("div");d.className="bubble "+(c||"assistant");d.textContent=String(t??"");$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight;return d}
function showSettings(){document.querySelector(".modal")?.remove();let enter=localStorage.getItem("aether_enter_send")!=="0",compact=localStorage.getItem("aether_compact")==="1",m=document.createElement("div");m.className="modal";m.innerHTML='<div class="sheet"><div class="sheetTitle">Settings</div><div class="setting"><div><div class="settingName">Purple theme</div><div class="settingDesc">Aether’s default interface theme.</div></div><div class="toggle on"><i></i></div></div><div class="setting"><div><div class="settingName">Enter to send</div><div class="settingDesc">Enter sends; Shift + Enter makes a new line.</div></div><button id="enterToggle" class="toggle '+(enter?"on":"")+'"><i></i></button></div><div class="setting"><div><div class="settingName">Compact chat</div><div class="settingDesc">Use tighter message spacing.</div></div><button id="compactToggle" class="toggle '+(compact?"on":"")+'"><i></i></button></div><div class="setting"><div><div class="settingName">Account</div><div class="settingDesc">'+(guestMode?"Guest session · 10-message limit":"Signed in · conversations are saved")+'</div></div></div><button id="logout" class="closeSheet">'+(guestMode?"End guest session":"Sign out")+'</button><button id="closeSettings" class="closeSheet">Close</button></div>';document.body.appendChild(m);
$("enterToggle").onclick=()=>{let v=localStorage.getItem("aether_enter_send")!=="0";localStorage.setItem("aether_enter_send",v?"0":"1");showSettings()};$("compactToggle").onclick=()=>{let v=localStorage.getItem("aether_compact")==="1";localStorage.setItem("aether_compact",v?"0":"1");document.body.classList.toggle("compact",!v);showSettings()};$("logout").onclick=()=>{localStorage.removeItem("aether_access_token");localStorage.removeItem("aether_guest_token");accessToken="";conversationId=null;guestMode=false;m.remove();showLogin()};$("closeSettings").onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()}}
function openChat(name,guest,remaining){guestMode=guest;conversationId=null;document.body.innerHTML='<div class="app"><aside class="sidebar" id="sidebar"><div class="sideTop"><div class="sideBrand">'+logoMarkup("sideLogo")+'<span>Aether</span></div><button id="closeSide" class="iconBtn">×</button></div><button id="newChat" class="newChat">＋ New chat</button><div class="sideTitle">Recent chats</div><div id="history" class="history"></div><div class="sideBottom"><div id="settingsRow" class="settingsRow">⚙ <span>Settings</span></div></div></aside><div id="scrim" class="scrim"></div><section class="chat"><header class="chatHeader"><button id="menu" class="iconBtn menu">☰</button>'+logoMarkup("sideLogo")+'<div class="headerText"><div class="headerTitle">Aether <span style="font-weight:400;color:#c0c8d7">· Online</span></div><div class="headerMeta"><span class="onlineDot"></span><span id="quota">'+(guest?"Guest · "+remaining+" messages remaining":name+" · signed in")+'</span></div></div><button id="settings" class="iconBtn">⚙</button></header><main id="messages" class="messages"><div class="empty"></div></main><form id="composer" class="composer"><textarea id="input" placeholder="Message Aether…" aria-label="Message Aether"></textarea><button id="send" class="send" type="submit">➤</button></form></section></div>';
const sidebar=$("sidebar"),scrim=$("scrim");$("menu").onclick=()=>{sidebar.classList.add("open");scrim.classList.add("show");loadHistory()};$("closeSide").onclick=closeMenus;scrim.onclick=closeMenus;$("settings").onclick=showSettings;$("settingsRow").onclick=showSettings;$("newChat").onclick=()=>{conversationId=null;$("messages").innerHTML='<div class="empty"></div>';closeMenus();$("input").focus()};
$("composer").onsubmit=e=>{e.preventDefault();send()};$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&localStorage.getItem("aether_enter_send")!=="0"){e.preventDefault();send()}});
loadHistory();setTimeout(()=>{try{AndroidAether.getJson("warm",backendUrl+"/health","")}catch(e){}},50);
function send(){if(busy)return;let text=$("input").value.trim();if(!text)return;$("input").value="";addBubble(text,"user");let t=addBubble("Thinking…","assistant thinking");busy=true;$("send").disabled=true;post(backendUrl+"/api/chat",{message:text,session_id:sessionId,force_agent:null,include_team_activity:false,conversation_id:conversationId||undefined},accessToken).then(d=>{t.remove();conversationId=d.conversation_id||conversationId;let q=d.guest_messages_remaining??d.messages_remaining??d.remaining;if(guest&&q!==undefined)$("quota").textContent="Guest · "+q+" messages remaining";addBubble(d?.content??d?.message??d?.response??d?.reply??d?.text??"Aether did not return a response.");loadHistory()}).catch(e=>{t.textContent=e.code===429?"Guest limit reached. Log in to continue.":"Aether is taking too long to respond. Please try again."}).finally(()=>{busy=false;$("send").disabled=false})}}
if(!backendUrl){document.body.innerHTML='<div class="screen center"><div class="card"><div class="logoRow">'+logoMarkup()+'<div><div class="brand">Aether</div><div class="sub" style="margin:0">AetherArc · standalone AI</div></div></div><div class="error">Backend unavailable. This build needs its configured Aether backend.</div></div></div>'}else{let saved=localStorage.getItem("aether_access_token"),guest=localStorage.getItem("aether_guest_token");if(saved){accessToken=saved;openChat("User",false)}else if(guest){accessToken=guest;guestMode=true;openChat("Guest",true,"10")}else showLogin()}
</script></body></html>
