<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aether — AetherArc</title>
<style>
:root{--bg:#070a10;--panel:#101622;--line:#263246;--text:#f4f7fb;--muted:#8995a8;--accent:#7c5cff;--ok:#35d07f;--danger:#ff5b6e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;-webkit-appearance:none;appearance:none}button{cursor:pointer;outline:none}
.screen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 80% 0,#182044 0,#070a10 48%)}
.login-card{width:min(430px,100%);padding:26px;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 20px 70px #0008}
.brand{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#37d8ff);font-weight:900;font-size:22px}.brand b{display:block;font-size:19px}.brand small{color:var(--muted)}
.login-brand .logo{width:52px;height:52px;border-radius:15px;font-size:29px}.login-brand b{font-size:27px}.login-brand small{font-size:15px}
.login-sub{color:var(--muted);line-height:1.5;margin:18px 0}.tabs{display:flex;gap:8px}.tab,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:11px 13px}.tab{flex:1}.tab.active,.btn.primary{background:var(--accent);border-color:transparent}.field{width:100%;padding:13px;margin:7px 0;border:1px solid var(--line);background:#0b1018;color:var(--text);border-radius:12px;outline:none}.btn.full{width:100%;margin-top:9px}.error{color:var(--danger);min-height:22px;margin-top:9px}
.app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 80% 0,#182044 0,#070a10 45%)}
.top{padding:18px 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#090c12e8}.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}.gear{font-size:20px;padding:7px 10px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px}
.toolbar{padding:10px 14px;display:flex;gap:8px;overflow:auto;border-bottom:1px solid var(--line);scrollbar-width:none}.toolbar::-webkit-scrollbar,.recent::-webkit-scrollbar{display:none}.toolbar button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:9px 18px}.toolbar button.active{background:var(--accent);border-color:transparent}
.recent{display:flex;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);overflow:auto;scrollbar-width:none;min-height:0}.recent-card{min-width:190px;max-width:240px;text-align:left;border:1px solid var(--line);background:#0d131e;color:var(--text);border-radius:11px;padding:8px 10px}.recent-card .r-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.recent-card .r-preview{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.messages{flex:1;overflow:auto;padding:14px}.welcome{padding:22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#111827,#0b101a);margin-bottom:14px}.welcome h2{margin:0 0 6px}.welcome p{color:var(--muted);line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:9px 12px}
.msg{display:flex;margin:10px 0}.msg.user{justify-content:flex-end}.bubble{max-width:90%;padding:12px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:var(--accent)}.ai .bubble{background:var(--panel);border:1px solid var(--line)}.meta{font-size:11px;color:var(--muted);margin-bottom:4px}.thinking{opacity:.75}
.composer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#090c12}.row{display:flex;gap:8px}.composer textarea{flex:1;min-height:48px;max-height:130px;resize:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:12px;outline:none}.composer textarea:focus{border-color:#6650cf}.send{width:56px;min-width:56px;border:1px solid transparent;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;text-align:center;box-shadow:none}.send:active{transform:scale(.97);background:#6949e8}.send:disabled{opacity:.55;transform:none}.footer{text-align:center;color:#596579;font-size:11px;padding:4px}
.settings{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;z-index:5}.sheet{width:100%;background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 18px 26px}.sheet h2{margin:0 0 7px}.sheet p,.sheet small{color:var(--muted);line-height:1.5}.setting{padding:15px 0;border-bottom:1px solid var(--line)}.setting input{float:right;width:20px;height:20px;accent-color:var(--accent)}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}
@media(max-width:600px){.top{padding:14px 12px 10px}.brand b{font-size:18px}.brand small{font-size:12px}.status{max-width:105px}.toolbar{padding:9px 10px}.toolbar button{padding:9px 15px}.recent{padding:7px 10px}.recent-card{min-width:170px}.messages{padding:12px}.bubble{max-width:94%}.composer{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<script>
const $=id=>document.getElementById(id);
let backendUrl="",token="",cid=null,rid=0,guest=false,busy=false,activeAgent="manager";
const sid=localStorage.getItem("aether_session_id")||(crypto.randomUUID?crypto.randomUUID():"aether-"+Date.now());
localStorage.setItem("aether_session_id",sid);
try{backendUrl=(AndroidAether.getBackendUrl()||"").replace(/\/+$/,"")}catch(e){}
function request(method,url,body,t=token,timeout=60000){return new Promise((resolve,reject)=>{const id="r"+(++rid);const timer=setTimeout(()=>{delete window.__aetherPending[id];const e=new Error("Request timed out");e.code=408;reject(e)},timeout);window.__aetherPending[id]={resolve:d=>{clearTimeout(timer);resolve(d)},reject:e=>{clearTimeout(timer);reject(e)}};try{if(method==="GET")AndroidAether.getJson(id,url,t?("Bearer "+t):"");else AndroidAether.postJson(id,url,t?("Bearer "+t):"",JSON.stringify(body||{}))}catch(e){clearTimeout(timer);delete window.__aetherPending[id];reject(e)}})}
window.__aetherPending={};
const get=(url,t=token)=>request("GET",url,null,t),post=(url,body,t=token)=>request("POST",url,body,t);
window.__aetherNativeResponse=(id,raw)=>{try{const d=JSON.parse(raw),p=window.__aetherPending[id];if(!p)return;delete window.__aetherPending[id];if(d.ok){let value={};try{value=JSON.parse(d.body||"{}")}catch(e){value={raw:d.body||""}}p.resolve(value)}else{let message=d.body||("HTTP "+d.code);try{const x=JSON.parse(message);message=x.detail||x.error||x.message||message}catch(e){}const err=new Error(String(message));err.code=d.code;p.reject(err)}}catch(e){const p=window.__aetherPending[id];if(p){delete window.__aetherPending[id];p.reject(e)}}};
window.__aetherOAuthToken=t=>{if(!t)return;token=t;guest=false;cid=null;localStorage.setItem("aether_access_token",t);localStorage.removeItem("aether_guest_token");openChat("User")};
const brand='<div class="brand"><div class="logo">A</div><div><b>Aether</b><small>AetherArc · standalone AI team</small></div></div>';
function login(){document.body.innerHTML='<div class="screen"><div class="login-card">'+brand.replace('class="brand"','class="brand login-brand"')+'<div class="login-sub">Sign in to keep your account and saved conversations. You can also continue with a limited guest session.</div><div class="tabs"><button id="signinTab" class="tab active">Sign in</button><button id="signupTab" class="tab">Create account</button></div><input id="email" class="field" type="email" autocomplete="email" placeholder="Email"><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Password (8+ characters)"><button id="submitAuth" class="btn primary full">Sign in</button><button id="google" class="btn full">Continue with Google</button><button id="guest" class="btn full">Continue as Guest · 10 messages</button><div id="authError" class="error"></div></div></div>';let signup=false;const paint=()=>{$("signinTab").className="tab "+(!signup?"active":"");$("signupTab").className="tab "+(signup?"active":"");$("submitAuth").textContent=signup?"Create account":"Sign in"};$("signinTab").onclick=()=>{signup=false;paint()};$("signupTab").onclick=()=>{signup=true;paint()};$("submitAuth").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value;if(!email||password.length<8){$("authError").textContent="Enter a valid email and a password with at least 8 characters.";return}const b=$("submitAuth");b.disabled=true;$("authError").textContent="";try{const d=await post(backendUrl+"/api/auth/"+(signup?"register":"login"),{email,password},"");if(!d.access_token)throw new Error("Authentication succeeded but no access token was returned.");token=d.access_token;guest=false;cid=null;localStorage.setItem("aether_access_token",token);localStorage.removeItem("aether_guest_token");openChat("User")}catch(e){$("authError").textContent=e.message||"Authentication failed.";b.disabled=false}};$("google").onclick=async()=>{const b=$("google");b.disabled=true;$("authError").textContent="";try{const d=await post(backendUrl+"/api/auth/google/login",{},"");if(!d.login_url)throw new Error("Google sign-in is not configured.");AndroidAether.openExternal(d.login_url)}catch(e){$("authError").textContent=e.message||"Google sign-in is not configured.";b.disabled=false}};$("guest").onclick=async()=>{const b=$("guest");b.disabled=true;$("authError").textContent="";try{const d=await post(backendUrl+"/api/auth/guest",{},"");if(!d.access_token)throw new Error("Guest session could not be created.");token=d.access_token;guest=true;cid=null;localStorage.setItem("aether_guest_token",token);localStorage.removeItem("aether_access_token");openChat("Guest",d.messages_remaining)}catch(e){$("authError").textContent=e.message||"Guest mode unavailable.";b.disabled=false}}}
async function hist(){if(guest)return[];try{return(await get(backendUrl+"/api/chat/conversations?limit=2")).conversations||[]}catch(e){return[]}}
function drawHist(items){const h=$("recent");if(!h)return;h.innerHTML="";items.slice(0,2).forEach(x=>{const b=document.createElement("button");b.type="button";b.className="recent-card";b.innerHTML='<div class="r-title"></div><div class="r-preview"></div>';b.querySelector(".r-title").textContent=x.title||"New chat";b.querySelector(".r-preview").textContent=x.preview||"Saved conversation";b.onclick=()=>openOld(x.id);h.appendChild(b)})}
async function openOld(id){try{const d=await get(backendUrl+"/api/chat/conversations/"+encodeURIComponent(id));cid=id;$("messages").innerHTML="";(d.messages||[]).forEach(m=>add(m.content,m.role==="user",m.agent_name||"Aether"));$("input").focus()}catch(e){}}
function add(text,user=false,label="Aether"){const m=document.createElement("div");m.className="msg "+(user?"user":"ai");m.innerHTML='<div><div class="meta"></div><div class="bubble"></div></div>';m.querySelector(".meta").textContent=label;m.querySelector(".bubble").textContent=String(text??"");$("messages").appendChild(m);$("messages").scrollTop=$("messages").scrollHeight;return m}
function showSettings(){const o=document.createElement("div");o.id="settingsOverlay";o.className="settings";o.innerHTML='<div class="sheet"><h2>Settings</h2><p>General Aether settings.</p><div class="setting"><b>Purple theme</b><br><small>Aether uses the original Build 19 purple AetherArc interface.</small></div><div class="setting"><b>Enter to send</b><input id="enter" type="checkbox" '+(localStorage.getItem("aether_enter_send")!=="0"?"checked":"")+'><br><small>Enter sends a message. Shift + Enter creates a new line.</small></div><div class="setting"><b>Compact chat</b><input id="compact" type="checkbox" '+(localStorage.getItem("aether_compact")==="1"?"checked":"")+'><br><small>Reduce spacing between messages.</small></div><div class="setting"><b>Account</b><br><small>'+(guest?"Guest session · 10-message limit":"Signed in · saved conversations")+'</small></div><div class="actions"><button id="closeSettings" class="btn">Close</button><button id="logout" class="btn primary">Log out</button></div></div>';o.querySelector("#closeSettings").onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()};o.querySelector("#enter").onchange=e=>localStorage.setItem("aether_enter_send",e.target.checked?"1":"0");o.querySelector("#compact").onchange=e=>localStorage.setItem("aether_compact",e.target.checked?"1":"0");o.querySelector("#logout").onclick=()=>{localStorage.removeItem("aether_access_token");localStorage.removeItem("aether_guest_token");location.reload()};document.body.appendChild(o)}
function bindChat(){$("gear").onclick=showSettings;const agentButtons=document.querySelectorAll(".agent");agentButtons.forEach(b=>b.onclick=()=>{agentButtons.forEach(x=>x.classList.remove("active"));b.classList.add("active");activeAgent=b.dataset.agent});$("input").onkeydown=e=>{const enter=localStorage.getItem("aether_enter_send")!=="0";if(e.key==="Enter"&&!e.shiftKey&&enter){e.preventDefault();send()}};$("composer").onsubmit=e=>{e.preventDefault();send()};$("send").onclick=e=>{e.preventDefault();send()};$("input").focus()}
async function openChat(name,remaining){document.body.innerHTML='<div class="app"><header class="top">'+brand+'<div class="status"><span class="dot"></span><span id="status">'+(guest?"Guest · "+(remaining??10)+" messages left":"AI online")+'</span><button id="gear" class="gear" type="button" aria-label="Settings">⚙</button></div></header><div class="toolbar"><button type="button" class="agent active" data-agent="manager">ManagerAI</button><button type="button" class="agent" data-agent="reason">ReasonAI</button><button type="button" class="agent" data-agent="code">CodeAI</button><button type="button" class="agent" data-agent="research">ResearchAI</button></div><div id="recent" class="recent"></div><main id="messages" class="messages"><div class="welcome"><h2>Welcome to Aether.</h2><p>ManagerAI is the front door. Pick a specialist above when you want to talk to that AI directly.</p><div class="chips"><button type="button" class="chip" data-q="Hi Aether!">Say hi</button><button type="button" class="chip" data-q="Break down this idea and tell me the best approach.">Reasoning</button><button type="button" class="chip" data-q="Help me build a Python app.">Coding</button><button type="button" class="chip" data-q="Research the latest technology trends.">Research</button></div></main><form id="composer" class="composer"><div class="row"><textarea id="input" placeholder="Message Aether…" rows="1"></textarea><button id="send" class="send" type="submit" aria-label="Send">➤</button></div><div class="footer">AetherArc · Redline Interactive Development</div></form></div>';bindChat();document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{$("input").value=b.dataset.q;$("input").focus()});drawHist(await hist());try{AndroidAether.getJson("warm",backendUrl+"/health","")}catch(e){}}
async function send(){if(busy)return;const i=$("input"),text=i.value.trim();if(!text)return;i.value="";add(text,true,"You");const thinking=add("Thinking…",false,"Aether");thinking.classList.add("thinking");busy=true;$("send").disabled=true;$("status").textContent="Thinking…";try{const d=await post(backendUrl+"/api/chat",{message:text,session_id:sid,conversation_id:cid||undefined,force_agent:activeAgent==="manager"?null:activeAgent,include_team_activity:false},token);thinking.remove();cid=d.conversation_id||cid;const q=d.guest_messages_remaining;$("status").textContent=guest&&q!==undefined?"Guest · "+q+" messages left":"AI online";const answer=d?.content??d?.message??d?.response??d?.reply??d?.text;add(answer?String(answer):"Aether did not return a response.",false,d?.agent||"Aether");drawHist(await hist())}catch(e){thinking.remove();add(e.code===429?"Guest limit reached. Log in to continue.":e.code===408?"Aether took too long to respond. Please try again.":"Aether couldn't complete the message: "+(e.message||"connection error"),false,"Aether");$("status").textContent=e.code===408?"Connection timeout":"Connection/error"}finally{busy=false;const sendButton=$("send");if(sendButton)sendButton.disabled=false}}
if(!backendUrl){document.body.innerHTML='<div class="screen"><div class="login-card">'+brand+'<div class="error">Backend unavailable.</div></div></div>'}else{const a=localStorage.getItem("aether_access_token"),g=localStorage.getItem("aether_guest_token");if(a){token=a;guest=false;openChat("User")}else if(g){token=g;guest=true;openChat("Guest",10)}else login()}
</script>
</body>
</html>
