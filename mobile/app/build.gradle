plugins { id 'com.android.application' }

def backendUrl = project.findProperty("AETHER_BACKEND_URL") ?: System.getenv("AETHER_BACKEND_URL") ?: "https://aetherarc-ai.onrender.com"
backendUrl = backendUrl.toString().trim().replaceAll("/+$", "")
if (backendUrl.isEmpty()) throw new GradleException("AETHER_BACKEND_URL must be configured")

android {
    namespace 'com.aetherarc.aether'
    compileSdk 36
    defaultConfig {
        applicationId 'com.aetherarc.aether'
        minSdk 24
        targetSdk 36
        versionCode 23
        versionName '0.9.0'
        buildConfigField "String", "AETHER_BACKEND_URL", '"' + backendUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
