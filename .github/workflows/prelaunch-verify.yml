name: Aether Standalone Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'prelaunch_verify.py'
      - '.github/workflows/prelaunch-verify.yml'
      - '.github/workflows/build-android.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify standalone architecture
        run: python prelaunch_verify.py
